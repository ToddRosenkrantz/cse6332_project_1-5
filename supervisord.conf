[program:mysql]
command=/usr/sbin/mysqld --defaults-file=/etc/mysql/my.cnf
user=mysql
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --appendonly yes --bind 0.0.0.0 --protected-mode no --ignore-warnings ARM64-COW-BUG
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:flask]
command=/usr/bin/python3 -m gunicorn --reload --bind 127.0.0.1:5000 app:app
directory=/data/flask
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:node]
command=/usr/bin/node app.js
directory=/data/node
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
