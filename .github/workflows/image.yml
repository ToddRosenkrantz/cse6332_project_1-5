# Builds the course image once for amd64 and arm64 and publishes it to GitHub Container Registry,
# so students download about 160 MB of ready-made layers instead of building the image themselves.
name: Publish image
on:
  push:
    branches: [main]
    paths: [Dockerfile, seed/**, scripts/**, sample/**, supervisord.conf, mysql-course.cnf, .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/toddrosenkrantz/cse6332-projects-1-5:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ToddRosenkrantz/cse6332_project_1-5
            org.opencontainers.image.description=CSE 6332 course container (nginx, Flask, Node.js, Redis, MySQL) for Projects 1-5
