<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <base href="/word-chart-app/">
  <meta charset="UTF-8" />
  <title>Book Word Frequency Charts</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    // Same theme toggle as the other pages; a theme change also redraws the charts.
    document.addEventListener('DOMContentLoaded', () => {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const toggleButton = document.getElementById('toggleTheme');
      const toggleIcon = document.getElementById('themeIcon');

      function updateThemeIcon() {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        toggleIcon.textContent = (currentTheme === 'dark') ? '☀️' : '🌙';
      }

      document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
      updateThemeIcon();

      toggleButton.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        document.documentElement.setAttribute('data-bs-theme', currentTheme === 'dark' ? 'light' : 'dark');
        updateThemeIcon();
        if (pieChart || barChart) loadCharts();   // redraw with the new colors
      });
    });
  </script>
</head>
<body class="container py-4">

  <!-- Theme toggle button -->
  <button id="toggleTheme" class="btn btn-secondary position-fixed top-0 end-0 m-3">
    <span id="themeIcon"></span> Toggle Theme
  </button>

  <h2 class="text-center mb-4">Word Frequency Charts</h2>

	<div class="mb-4">
  	<label for="bookSelect" class="form-label">Select Book:</label>
  	<select id="bookSelect" class="form-select w-auto d-inline-block me-2"></select>

  	<button onclick="loadCharts()" class="btn btn-primary me-3">Load</button>

  	<label for="filterLevel" class="form-label me-2">
    	Filter Level:
  	</label>

  	<select
    	id="filterLevel"
    	class="form-select w-auto d-inline-block"
  	>
    	<option value="none">None</option>
    	<option value="basic" selected>Basic</option>
    	<option value="literary">Literary</option>
  	</select>
	</div>

  <div class="row g-4 mb-4">
    <div class="col-auto">
      <label for="topN" class="form-label">Top N (Pie): <span id="nVal">5</span></label>
      <input type="range" id="topN" onchange="loadCharts()" class="form-range" min="5" max="100" step="5" value="5"
             oninput="document.getElementById('nVal').textContent = this.value">
    </div>
    <div class="col-auto">
      <label for="topM" class="form-label">Top M (Bar): <span id="mVal">25</span></label>
      <input type="range" id="topM" onchange="loadCharts()" class="form-range" min="5" max="100" step="5" value="25"
             oninput="document.getElementById('mVal').textContent = this.value">
    </div>
  </div>

  <hr class="my-4" />
  <div id="bookChartTitle" class="text-center mb-4">
    <h2 class="mb-0">Word Frequency Charts</h2>
    <div id="bookSubtitle" class="fst-italic subtitle-text"></div>
  </div>
  

  <div class="d-flex justify-content-center gap-4 flex-wrap">
    <div class="text-center">
      <h3>Pie Chart</h3>
      <canvas id="wordPieChart" width="400" height="400" class="border rounded"></canvas>
    </div>
    <div class="text-center">
      <h3>Horizontal Bar Chart</h3>
      <div id="barChartContainer" class="border rounded"></div>
    </div>
  </div>

  <script>
    let books = [];
    let pieChart = null;
    let barChart = null;

    // Chart colors come from the page's current theme, read each time the charts are drawn.
    function themeColors() {
      const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      return {
        labelColor: isDark ? '#f1f1f1' : '#000000',
        gridColor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'
      };
    }

    window.onload = loadBooks;

    async function loadBooks() {
      try {
        const res = await fetch('api/books');
        const data = await res.json();

        const select = document.getElementById('bookSelect');
        books = data;
        select.innerHTML = books.map(b =>
          `<option value="${b}">${b.replaceAll('_', ' ')}</option>`
        ).join('');

        if (books.length > 0) {
					document
  					.getElementById('filterLevel')
  					.addEventListener('change', loadCharts);
          select.value = books[0];
          loadCharts();
        }
      } catch (err) {
        console.error("Failed to load books:", err);
        alert("Failed to load books from /api/books.");
      }
		document
  		.getElementById('filterLevel')
  		.addEventListener('change', loadCharts);
    }

    async function loadCharts() {
			const bookId = document.getElementById('bookSelect').value;
			const topN = parseInt(document.getElementById('topN').value);
			const topM = parseInt(document.getElementById('topM').value);
			const filter =
  			document.getElementById('filterLevel').value;

			const [nDataRes, mDataRes] = await Promise.all([
				fetch(`api/book/${bookId}/top/${topN}?filter=${filter}`),
				fetch(`api/book/${bookId}/top/${topM}?filter=${filter}`)
			]);


      const nData = await nDataRes.json();
      const mData = await mDataRes.json();

      const pieLabels = nData.map(d => d.word);
      const pieCounts = nData.map(d => d.count);
      const barLabels = mData.map(d => d.word);
      const barCounts = mData.map(d => d.count);

      const { labelColor, gridColor } = themeColors();

      const titleText = bookId.replaceAll('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
      //document.getElementById('bookChartTitle').textContent = `Word Frequency Charts for ${titleText}`;
      document.getElementById('bookSubtitle').textContent = `(${titleText})`;

      // PIE CHART
      const pieCtx = document.getElementById('wordPieChart').getContext('2d');
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(pieCtx, {
        type: 'pie',
        data: {
          labels: pieLabels,
          datasets: [{ data: pieCounts }]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: labelColor }
            }
          }
        }
      });

      // BAR CHART
      const barContainer = document.getElementById('barChartContainer');
      if (barChart) barChart.destroy();
      const existing = document.getElementById('wordBarChart');
      if (existing) existing.remove();

      const canvas = document.createElement('canvas');
      canvas.id = 'wordBarChart';
      canvas.width = 600;
      canvas.height = topM * 25;
      canvas.style.height = `${topM * 25}px`;
      barContainer.appendChild(canvas);

      const barCtx = canvas.getContext('2d');
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: barLabels,
          datasets: [{
            label: 'Top Words',
            data: barCounts
          }]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: {
            legend: {
              labels: { color: labelColor }
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              ticks: { color: labelColor },
              grid: {
                color: gridColor,
                lineWidth: 1
              }
            },
            y: {
              ticks: { color: labelColor },
              grid: {
                color: gridColor,
                lineWidth: 1
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
