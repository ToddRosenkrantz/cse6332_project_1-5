<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Word Charts - Word Chart App</title>
  <base href="/word-chart-app/">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const toggleButton = document.getElementById('toggleTheme');
      const toggleIcon = document.getElementById('themeIcon');

      function updateThemeIcon() {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        toggleIcon.textContent = (currentTheme === 'dark') ? '☀️' : '🌙';
      }

      if (prefersDark) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
      updateThemeIcon();

      toggleButton.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        document.documentElement.setAttribute('data-bs-theme', currentTheme === 'dark' ? 'light' : 'dark');
        updateThemeIcon();
        drawChart();   // redraw the current chart with the new colors
      });

      const bookSelect = document.getElementById('book');
      const topNInput = document.getElementById('topN');
      const filterCheck = document.getElementById('filterStopWords');
      const chartCanvas = document.getElementById('chartCanvas');
      let chartInstance = null;
      let lastChart = null;   // the data last shown, so a theme change can redraw it

      // Draws lastChart with colors from the page's current theme.
      function drawChart() {
        if (!lastChart) return;
        const { data, title, topN } = lastChart;
        const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
        const labelColor = isDark ? '#f1f1f1' : '#000000';
        const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';

        if (chartInstance) {
          chartInstance.destroy();
        }

        chartInstance = new Chart(chartCanvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: data.labels,
            datasets: [{
              label: `Top ${topN} Words in "${title}"`,
              data: data.counts,
              backgroundColor: 'rgba(54, 162, 235, 0.5)'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: labelColor } }
            },
            scales: {
              x: {
                ticks: { color: labelColor },
                grid: { color: gridColor }
              },
              y: {
                beginAtZero: true,
                ticks: { color: labelColor },
                grid: { color: gridColor }
              }
            }
          }
        });
      }

      async function loadBooks() {
        try {
          const res = await fetch('api/books');
          const books = await res.json();
          books.sort();
          books.forEach(title => {
            const option = document.createElement('option');
            option.value = option.textContent = title;
            bookSelect.appendChild(option);
          });
        } catch (error) {
          console.error('Error loading books:', error);
        }
      }

      loadBooks();

      document.getElementById('chartForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = bookSelect.value;
        const topN = topNInput.value || 20;
				const filter = document.getElementById('filterLevel').value;

        if (!title) {
          alert('Please select a book!');
          return;
        }

        try {
          const res = await fetch(`api/chart-data/${encodeURIComponent(title)}/${topN}?filter=${filter}`);
          const data = await res.json();

          lastChart = { data, title, topN };
          drawChart();

        } catch (err) {
          console.error('Error loading chart:', err);
          alert('Failed to load chart data.');
        }
      });
    });
  </script>
</head>

<body class="bg-body">

<!-- Theme toggle button -->
<button id="toggleTheme" class="btn btn-secondary position-fixed top-0 end-0 m-3">
  <span id="themeIcon"></span> Toggle Theme
</button>

<div class="container my-5">
  <h1 class="text-center mb-4">📊 Word Frequency Chart</h1>

  <form id="chartForm" class="p-4 rounded bg-body-secondary shadow-sm mb-5">
    <div class="mb-3">
      <label for="book" class="form-label">Select Book:</label>
      <select id="book" class="form-select" required>
        <option value="" disabled selected>Select a book</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="topN" class="form-label">Number of Top Words:</label>
      <input type="number" id="topN" class="form-control" min="1" max="100" value="20">
    </div>

		<div class="mb-3">
  		<label for="filterLevel" class="form-label">
    		Filter Level
  		</label>

		  <select id="filterLevel" class="form-select">
    		<option value="none">None</option>
    		<option value="basic" selected>Basic</option>
    		<option value="literary">Literary</option>
  		</select>

  		<div class="form-text">
    		Basic removes common English stop words.
    		Literary additionally removes words such as "said", "mr", and "mrs".
  		</div>
		</div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary btn-lg">Generate Chart</button>
    </div>
  </form>

  <div style="height: 500px;">
    <canvas id="chartCanvas"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
