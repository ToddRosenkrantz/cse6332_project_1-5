server {
    listen 80 default_server;
    root /data/www;
    index index.html;

    location / { try_files $uri $uri/ =404; }

    location /flask/ { proxy_pass http://127.0.0.1:5000/; proxy_set_header Host $host; }
    location /node/  { proxy_pass http://127.0.0.1:3000/; proxy_set_header Host $host; }
}
