# One container for Projects 1-5.  Start:  docker compose up -d
# The first start downloads the prebuilt image (about 160 MB) and loads the classicmodels sample database;
# follow it with: docker compose logs -f
# To build the image yourself instead of downloading it:  docker compose up -d --build
services:
  course:
    image: ghcr.io/toddrosenkrantz/cse6332-projects-1-5:latest   # prebuilt for amd64 and arm64
    build: .                                               # used only if the image cannot be pulled or with --build
    container_name: cse6332-course
    restart: unless-stopped
    ports:                      # all bound to localhost only
      - "127.0.0.1:8080:80"     # nginx -> http://localhost:8080
      - "127.0.0.1:3306:3306"   # MySQL -> user student / password student
      - "127.0.0.1:6379:6379"   # Redis
      - "127.0.0.1:9000-9009:9000-9009"   # your own apps: listen on 0.0.0.0:9000-9009 inside the container
    environment:
      SEMESTER_START: "2026-10-12"   # latest date in the sample data is shifted to this day
      STUDENT_PASSWORD: "student"
    volumes:
      - ./data:/data:z          # host-visible: www/, flask/, node/, nginx/, mysql/, redis/
